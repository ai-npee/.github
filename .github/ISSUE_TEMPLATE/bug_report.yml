name: 🐛 问题反馈
description: 报告资料中的错误、工具缺陷或文档问题
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue/Discussion，避免重复。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚、简洁地说明问题是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附截图或日志
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 位置
      description: 仓库名 + 文件路径 / 页码
      placeholder: npee-math-exam-papers / latex/pages/pages-023.tex
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 不适用
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: 相关工具版本
      description: TeX Live / Python / Node 等，按需填写
      placeholder: TeX Live 2026, Python 3.12
    validations:
      required: false
