name: 💡 功能建议
description: 提出新资料、新工具或改进建议
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请先搜索现有 Issue/Discussion，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 这个建议要解决什么问题？
      placeholder: 我在……时，需要……，但目前……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望我们怎么做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 可选，说明你权衡过什么
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 资料内容
        - 工具 / 脚本
        - 文档 / 排版
        - 组织流程
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 与 Discussions
          required: true
        - label: 该建议不涉及侵权或未授权资料的传播
          required: true
